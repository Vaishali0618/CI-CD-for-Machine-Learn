name: ML Continuous Integration and Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: write-all

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black cmlrunner huggingface_hub

      - name: Check formatting
        run: |
          black --check train.py

      - name: Train model and generate metrics
        run: |
          python train.py

      - name: Generate evaluation report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model Evaluation" > report.md
          cat results/metrics.txt >> report.md
          echo "### Confusion Matrix" >> report.md
          cml comment create report.md --watermark-title="Model Metrics" || true

      - name: Deploy to Hugging Face Static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os

          api = HfApi(token=os.environ['HF_TOKEN'])
          space_id = os.environ['HF_SPACE_ID']

          api.upload_folder(
              folder_path='app',
              repo_id=space_id,
              repo_type='space',
              path_in_repo='.'
          )

          api.upload_folder(
              folder_path='model',
              repo_id=space_id,
              repo_type='space',
              path_in_repo='model'
          )
          "
