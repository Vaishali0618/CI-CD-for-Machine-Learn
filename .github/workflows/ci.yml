name: ML Continuous Integration and Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: write-all

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas scikit-learn joblib black cmlrunner huggingface_hub

      - name: Auto-format code
        run: |
          black train.py || true

      - name: Train model and generate metrics
        run: |
          python train.py

      - name: Generate evaluation report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model Evaluation" > report.md
          cat results/metrics.txt >> report.md || true
          cml comment create report.md || true

      - name: Deploy to Hugging Face Static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN')
          space_id = os.environ.get('HF_SPACE_ID', 'BTS06/drug-classification-lite')

          if not token:
              print('Warning: HF_TOKEN secret not found in GitHub. Skipping upload step.')
          else:
              try:
                  api = HfApi(token=token)
                  api.upload_folder(
                      folder_path='app',
                      repo_id=space_id,
                      repo_type='space',
                      path_in_repo='.'
                  )
                  api.upload_folder(
                      folder_path='model',
                      repo_id=space_id,
                      repo_type='space',
                      path_in_repo='model'
                  )
                  print('Deployment successful!')
              except Exception as e:
                  print(f'Hugging Face upload issue: {e}')
          "
